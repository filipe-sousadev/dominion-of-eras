# Compila o APK Android do Dominion of Eras e publica em "Releases".
# Roda a cada push na branch main e também manualmente (aba Actions → Android APK → Run workflow).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: 4.4.1-stable

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Baixar Godot e os modelos de exportação
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$tdir"
          rm godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            # chave fixa guardada nos Secrets do repositório: as atualizações instalam por cima
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            user="$KEYSTORE_USER"; pass="$KEYSTORE_PASS"
          else
            # sem Secrets: chave nova a cada compilação (desinstale a versão anterior antes de atualizar)
            user="dominion"; pass="dominion-of-eras"
            keytool -genkeypair -keystore "$ks" -alias "$user" -storepass "$pass" -keypass "$pass" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dominion of Eras"
          fi
          echo "::add-mask::$pass"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Configurar o Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Exportar o APK
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --export-release "Android" "$PWD/build/dominion-of-eras.apk"
          ls -la build
          test -s build/dominion-of-eras.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/dominion-of-eras.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dominion-of-eras-apk
          path: build/dominion-of-eras.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dominion of Eras (build ${{ github.run_number }})
          body: |
            APK Android (arm64). No celular: baixe o arquivo `dominion-of-eras.apk` abaixo, abra e permita
            "instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.
          files: build/dominion-of-eras.apk
